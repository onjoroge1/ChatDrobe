name: Website bug
description: Report a reproducible website problem without private information.
title: '[Website] '
body:
  - type: markdown
    attributes:
      value: 'Reports are public. Do not include private chats, passwords, API keys or personal screenshots. For extension problems, identify the extension version explicitly.'
  - type: input
    id: page
    attributes:
      label: Page and browser version
      placeholder: /themes/mooncat/ — Chrome desktop, version ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and expected behavior
      description: Use fictional sample data. Include viewport width when relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no private conversation content or credentials.
          required: true
