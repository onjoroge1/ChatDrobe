name: Website quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and contract tests
        run: npm run check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: HTTP browser checks
        run: python tests/browser.py
      - name: Living Worlds HTTP browser checks
        run: python tests/living-browser.py
      - name: Quiet companion HTTP browser checks
        run: python tests/quiet-browser.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: website-review-artifacts
          path: |
            dist/
            test-results/
          retention-days: 7
